<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #customers{
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        #customer td, #customer th{
            border: 1px solid #ddd;
            padding: 8px;
        }

        #customer tr:nth-child(even){
            background-color: #f2f2f2;
        }

        #customers tr:hover{
            background-color: #faf79f;
        }

        #customers th{
            padding-top: 12px;
            text-transform: upppercase;
            padding-bottom: 12px;
            text-align: center;
            background-color: #08d38c;
            color: white;
        }
    </style>
</head>
<body>
    <h5>5.8 CSS Table</h5>
    <table id="customers">
        <tr>
            <th>Company</th>
            <th>Contact</th>

        </tr>

</body>
</html>
