<!DOCTYPE html>
<html lang="en">
<head>
    
    <style>
        ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
        }

        li{
            float: left;
        }

        li a{
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        /*Change the link to #111 (block) on hover*/
        li a:hover{
            background: #111;
        }
    </style> 
</head>
<body>
    <h5>5.9 CSS Navigation Bar</h5>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#news">News</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="#about">About</a></li>
    </ul>
</body>
</html>
